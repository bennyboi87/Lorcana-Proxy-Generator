<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorcana Proxy Sheet Generator</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #121824;
      --card-bg: #1c2436;
      --accent: #dca842;
      --text: #f0f4f8;
      --text-muted: #94a3b8;
      --border: #2e3a52;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #0f141d;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.95rem;
      box-sizing: border-box;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .options {
      display: flex;
      gap: 16px;
      margin: 16px 0;
    }
    .options label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    select {
      background: #0f141d;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
    }
    button {
      background: var(--accent);
      color: #121824;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
      color: #94a3b8;
    }
    #status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      font-family: monospace;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Lorcana Proxy Sheet Generator</h1>
  <p>Paste your decklist or card names below (e.g. <code>4 Strength of a Raging Fire</code> or <code>1 Max Goof - Rebellious Teen</code>).</p>

  <textarea id="decklist" placeholder="4 Strength of a Raging Fire&#10;1 Max Goof - Rebellious Teen&#10;3 Angela - Night Warrior&#10;You Broke My Smolder"></textarea>

  <div class="options">
    <label>
      Paper Format
      <select id="paperSize">
        <option value="a4" selected>A4 (210 × 297 mm)</option>
        <option value="letter">US Letter (8.5 × 11 in)</option>
      </select>
    </label>
  </div>

  <button id="generateBtn" onclick="processList()">Generate Proxy PDF</button>

  <div id="status"></div>
</div>

<script>
  const MM_TO_PT = 2.83465;
  const CARD_WIDTH_MM = 63;
  const CARD_HEIGHT_MM = 88;
  const CARD_W = CARD_WIDTH_MM * MM_TO_PT;
  const CARD_H = CARD_HEIGHT_MM * MM_TO_PT;

  function log(msg) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.scrollTop = el.scrollHeight;
  }

  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // --- IndexedDB Local Persistent Cache ---
  function openCacheDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("LorcanaProxyCache", 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("card_images")) {
          db.createObjectStore("card_images");
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function getCachedImage(key) {
    try {
      const db = await openCacheDB();
      return new Promise((resolve) => {
        const tx = db.transaction("card_images", "readonly");
        const store = tx.objectStore("card_images");
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    } catch {
      return null;
    }
  }

  async function setCachedImage(key, buffer) {
    try {
      const db = await openCacheDB();
      const tx = db.transaction("card_images", "readwrite");
      const store = tx.objectStore("card_images");
      store.put(buffer, key);
    } catch (err) {
      console.warn("Failed saving image to IndexedDB", err);
    }
  }

  // Helper to normalize card names into repo image paths
  function slugify(text) {
    return text
      .toLowerCase()
      .trim()
      .replace(/\s*-\s*/g, "-")
      .replace(/[^a-z0-9\-]/g, "")
      .replace(/\-+/g, "-");
  }

  function parseLine(line) {
    line = line.trim();
    if (!line) return null;
    const match = line.match(/^(\d+)x?\s+(.*)$/i);
    if (match) {
      return { count: parseInt(match[1], 10), name: match[2].trim() };
    }
    return { count: 1, name: line };
  }

  async function fetchWithTimeout(url, options = {}, timeoutMs = 7000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return response;
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  // --- Step 1: Check Repo Cache, IndexedDB, or Lorcast API ---
  async function resolveCardImage(name) {
    const slug = slugify(name);

    // 1. Check browser's persistent IndexedDB
    const idbCached = await getCachedImage(slug);
    if (idbCached) {
      return { buffer: idbCached, source: "browser cache" };
    }

    // 2. Check if image is hosted in your GitHub repo (/images folder)
    const localExtensions = ["webp", "jpg", "jpeg", "png"];
    for (const ext of localExtensions) {
      const localUrl = `images/${slug}.${ext}`;
      try {
        const head = await fetch(localUrl, { method: "HEAD" });
        if (head.ok) {
          const res = await fetch(localUrl);
          const buf = await res.arrayBuffer();
          await setCachedImage(slug, buf);
          return { buffer: buf, source: "github repo" };
        }
      } catch {}
    }

    // 3. Fallback: Search the public Lorcast API
    try {
      const url = `https://api.lorcast.com/v0/cards/search?q=${encodeURIComponent(name)}`;
      const res = await fetchWithTimeout(url, {}, 6000);
      if (res.ok) {
        const data = await res.json();
        if (data && data.results && data.results.length > 0) {
          const card = data.results[0];
          const imgUrl = card.image_uris?.digital?.large || card.image_uris?.digital?.normal || null;
          if (imgUrl) {
            const buf = await downloadBufferWithFallback(imgUrl);
            if (buf) {
              await setCachedImage(slug, buf);
              return { buffer: buf, source: "api download" };
            }
          }
        }
      }
    } catch (e) {
      console.warn(`API lookup failed for ${name}:`, e);
    }

    return null;
  }

  // Fetch image bytes with immediate CORS proxy fallback
  async function downloadBufferWithFallback(url) {
    try {
      const res = await fetchWithTimeout(url, {}, 6000);
      if (res.ok) return await res.arrayBuffer();
    } catch {}

    try {
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      const res = await fetchWithTimeout(proxyUrl, {}, 8000);
      if (res.ok) return await res.arrayBuffer();
    } catch {}

    return null;
  }

  // --- Main PDF Generation Pipeline ---
  async function processList() {
    const btn = document.getElementById("generateBtn");
    const text = document.getElementById("decklist").value;
    const paperType = document.getElementById("paperSize").value;
    const lines = text.split("\n");

    const parsedCards = [];
    for (const l of lines) {
      const item = parseLine(l);
      if (item) parsedCards.push(item);
    }

    if (parsedCards.length === 0) {
      log("Please enter at least one card name.");
      return;
    }

    btn.disabled = true;
    log("Resolving card artwork...");

    const resolvedBuffers = {};
    const cardQueue = [];

    for (const entry of parsedCards) {
      const slug = slugify(entry.name);
      
      if (!resolvedBuffers[slug]) {
        log(`Locating: ${entry.name}...`);
        const result = await resolveCardImage(entry.name);
        if (!result) {
          log(`Skipping "${entry.name}" (not found in repo, cache, or API)`);
          continue;
        }
        resolvedBuffers[slug] = result.buffer;
        log(`✓ Loaded ${entry.name} (${result.source})`);
        await delay(80); // gentle pacing
      }

      for (let i = 0; i < entry.count; i++) {
        cardQueue.push({ name: entry.name, buffer: resolvedBuffers[slug] });
      }
    }

    if (cardQueue.length === 0) {
      log("No valid card images could be loaded.");
      btn.disabled = false;
      return;
    }

    log(`Assembling PDF with ${cardQueue.length} card(s)...`);

    const pageWidth = paperType === "a4" ? 210 * MM_TO_PT : 8.5 * 72;
    const pageHeight = paperType === "a4" ? 297 * MM_TO_PT : 11 * 72;

    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.create();

    const cols = 3;
    const rows = 3;
    const gridWidth = cols * CARD_W;
    const gridHeight = rows * CARD_H;
    const marginX = (pageWidth - gridWidth) / 2;
    const marginY = (pageHeight - gridHeight) / 2;

    const embeddedCache = new Map();
    let page = null;
    let placedCards = 0;

    for (let i = 0; i < cardQueue.length; i++) {
      const item = cardQueue[i];

      const itemIndexOnPage = placedCards % 9;
      if (itemIndexOnPage === 0) {
        page = pdfDoc.addPage([pageWidth, pageHeight]);
      }

      const col = itemIndexOnPage % 3;
      const row = Math.floor(itemIndexOnPage / 3);
      const x = marginX + col * CARD_W;
      const y = pageHeight - marginY - (row + 1) * CARD_H;

      let embeddedImg = embeddedCache.get(item.buffer);
      if (!embeddedImg) {
        try {
          embeddedImg = await pdfDoc.embedJpg(item.buffer);
        } catch {
          try {
            embeddedImg = await pdfDoc.embedPng(item.buffer);
          } catch (err) {
            console.error(`Embed error on ${item.name}`, err);
            continue;
          }
        }
        embeddedCache.set(item.buffer, embeddedImg);
      }

      page.drawImage(embeddedImg, {
        x: x,
        y: y,
        width: CARD_W,
        height: CARD_H,
      });

      placedCards++;
    }

    log("Finalizing PDF download...");
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = "lorcana-proxies.pdf";
    a.click();

    log(`Success! Generated PDF with ${placedCards} cards.`);
    btn.disabled = false;
  }
</script>
</body>
</html>
